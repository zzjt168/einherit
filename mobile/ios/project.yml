name: EInherit
options:
  bundleIdPrefix: com.zzjt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  EInherit:
    type: application
    platform: iOS
    sources:
      - path: EInherit
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzjt.einherit
        PRODUCT_NAME: EInherit
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "8P45W5X9HY"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: EInherit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: EInherit/Info.plist
      properties:
        CFBundleDisplayName: 电子继承
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
schemes:
  EInherit:
    build:
      targets:
        EInherit: all
    run:
      config: Debug
    archive:
      config: Release
